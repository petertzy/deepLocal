name: Publish desktop release

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: desktop-release-manual
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Windows and Linux installers
    runs-on: ubuntu-latest
    steps:
      - name: Select latest successful packaging run
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/actions/workflows/desktop-packaging.yml/runs?event=workflow_dispatch&status=success&per_page=100" > "$RUNNER_TEMP/runs.json"
          run_id="$(jq -r '.workflow_runs[0].id // empty' "$RUNNER_TEMP/runs.json")"
          run_sha="$(jq -r '.workflow_runs[0].head_sha // empty' "$RUNNER_TEMP/runs.json")"
          [[ -n "$run_id" && -n "$run_sha" ]] || { echo "No successful packaging run found." >&2; exit 1; }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "run_sha=$run_sha" >> "$GITHUB_OUTPUT"

      - name: Download packaging artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ steps.resolve.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/installers"
          gh run download "$RUN_ID" --repo "$GH_REPO" --dir "$RUNNER_TEMP/installers"

      - name: Resolve packaged version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_SHA: ${{ steps.resolve.outputs.run_sha }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t manifests < <(find "$RUNNER_TEMP/installers" -name release-version.txt -type f)
          [[ "${#manifests[@]}" == 2 ]] || { echo "Expected two version manifests." >&2; exit 1; }
          version="$(cat "${manifests[0]}")"
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          [[ "$(cat "${manifests[1]}")" == "$version" ]] || { echo "Package versions differ." >&2; exit 1; }
          if gh release view "$version" >/dev/null 2>&1; then
            echo "Release $version already exists. Refusing to overwrite it." >&2
            exit 1
          fi
          if gh api "repos/$GH_REPO/git/ref/tags/$version" >/dev/null 2>&1; then
            echo "Tag $version already exists. Refusing to overwrite it." >&2
            exit 1
          fi
          echo "release_tag=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing $version from commit $RUN_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Validate installer files
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/installers"
          mapfile -d '' files < <(find . -type f \( -name '*.exe' -o -name '*.deb' -o -name '*.AppImage' \) -print0)
          (("${#files[@]}" > 0)) || { echo "No installer files were downloaded." >&2; exit 1; }
          find . -type f | sort
          find . -type f \( -name '*.exe' -o -name '*.deb' -o -name '*.AppImage' \) -exec sha256sum {} +
          test "$(find . -type f -name '*.exe' | wc -l)" -gt 0 || { echo "Windows installer is missing." >&2; exit 1; }
          test "$(find . -type f -name '*.deb' | wc -l)" -gt 0 || { echo "Linux DEB is missing." >&2; exit 1; }
          test "$(find . -type f -name '*.AppImage' | wc -l)" -gt 0 || { echo "Linux AppImage is missing." >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/upload"
          for file in "${files[@]}"; do
            name="$(basename "$file")"
            [[ ! -e "$RUNNER_TEMP/upload/$name" ]] || { echo "Duplicate installer filename: $name" >&2; exit 1; }
            cp "$file" "$RUNNER_TEMP/upload/$name"
          done

      - name: Upload installers to existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=("$RUNNER_TEMP"/upload/*)
          (("${#files[@]}" > 0)) || exit 1
          gh release create "$RELEASE_TAG" "${files[@]}" --repo "$GH_REPO" --target "${{ steps.resolve.outputs.run_sha }}" --title "deepLocal $RELEASE_TAG" --notes "Windows and Linux desktop installers. macOS packages can be added separately."
          gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json url --jq '.url' >> "$GITHUB_STEP_SUMMARY"
