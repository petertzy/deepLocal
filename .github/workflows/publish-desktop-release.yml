name: Publish desktop release

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: desktop-release-manual
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Windows and Linux installers
    runs-on: ubuntu-latest
    steps:
      - name: Resolve matching build and release
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GH_REPO/actions/workflows/desktop-packaging.yml/runs?event=workflow_dispatch&status=success&per_page=100" --jq '.workflow_runs[] | [.id, .head_sha] | @tsv' > "$RUNNER_TEMP/build-runs.tsv"
          gh release list --limit 1000 --json tagName,isDraft --jq '.[] | select(.isDraft == false) | .tagName' > "$RUNNER_TEMP/release-tags.txt"
          while IFS=$'\t' read -r run_id run_sha; do
            [[ -n "$run_id" ]] || continue
            while IFS= read -r tag; do
              [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]] || continue
              ref_json="$(gh api "repos/$GH_REPO/git/ref/tags/$tag")"
              tag_sha="$(jq -r '.object.sha' <<< "$ref_json")"
              if [[ "$(jq -r '.object.type' <<< "$ref_json")" == "tag" ]]; then
                tag_sha="$(gh api "repos/$GH_REPO/git/tags/$tag_sha" --jq '.object.sha')"
              fi
              if [[ "$run_sha" == "$tag_sha" ]]; then
                echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
                echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
                echo "Selected build $run_id for release $tag ($run_sha)" >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            done < "$RUNNER_TEMP/release-tags.txt"
          done < "$RUNNER_TEMP/build-runs.tsv"
          echo "::error::No successful packaging run matches an existing published release tag."
          echo "Successful packaging runs:" >&2
          head -n 10 "$RUNNER_TEMP/build-runs.tsv" >&2
          echo "Published release tags:" >&2
          head -n 20 "$RUNNER_TEMP/release-tags.txt" >&2
          echo "Create a release tag at the packaging run commit, or run Desktop packaging on the commit of an existing release tag." >&2
          echo "The publishing workflow will not silently attach binaries built from a different commit." >&2
          exit 1

      - name: Download packaging artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ steps.resolve.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/installers"
          gh run download "$RUN_ID" --repo "$GH_REPO" --dir "$RUNNER_TEMP/installers"

      - name: Validate installer files
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/installers"
          mapfile -d '' files < <(find . -type f \( -name '*.exe' -o -name '*.deb' -o -name '*.AppImage' \) -print0)
          (("${#files[@]}" > 0)) || { echo "No installer files were downloaded." >&2; exit 1; }
          find . -type f | sort
          find . -type f \( -name '*.exe' -o -name '*.deb' -o -name '*.AppImage' \) -exec sha256sum {} +
          test "$(find . -type f -name '*.exe' | wc -l)" -gt 0 || { echo "Windows installer is missing." >&2; exit 1; }
          test "$(find . -type f -name '*.deb' | wc -l)" -gt 0 || { echo "Linux DEB is missing." >&2; exit 1; }
          test "$(find . -type f -name '*.AppImage' | wc -l)" -gt 0 || { echo "Linux AppImage is missing." >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/upload"
          for file in "${files[@]}"; do
            name="$(basename "$file")"
            [[ ! -e "$RUNNER_TEMP/upload/$name" ]] || { echo "Duplicate installer filename: $name" >&2; exit 1; }
            cp "$file" "$RUNNER_TEMP/upload/$name"
          done

      - name: Upload installers to existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.resolve.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=("$RUNNER_TEMP"/upload/*)
          (("${#files[@]}" > 0)) || exit 1
          gh release upload "$RELEASE_TAG" "${files[@]}" --repo "$GH_REPO"
          gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json url --jq '.url' >> "$GITHUB_STEP_SUMMARY"
