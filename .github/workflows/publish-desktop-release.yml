name: Publish desktop release

on:
  workflow_dispatch:
    inputs:
      packaging_run_id:
        description: "Optional successful packaging run ID (defaults to latest successful run)"
        type: string
        default: ""

permissions:
  actions: read
  contents: write

concurrency:
  group: desktop-release-manual
  cancel-in-progress: false

jobs:
  publish:
    name: Publish desktop installers
    runs-on: ubuntu-latest
    steps:
      - name: Select successful packaging run
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REQUESTED_RUN_ID: ${{ inputs.packaging_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$REQUESTED_RUN_ID" ]]; then
            [[ "$REQUESTED_RUN_ID" =~ ^[0-9]+$ ]] || { echo "Invalid packaging run ID." >&2; exit 1; }
            gh api "repos/$GH_REPO/actions/runs/$REQUESTED_RUN_ID" > "$RUNNER_TEMP/run.json"
            jq -e '.conclusion == "success" and .event == "workflow_dispatch" and .name == "Desktop packaging"' "$RUNNER_TEMP/run.json" >/dev/null || {
              echo "Selected run is not a successful Desktop packaging workflow." >&2
              exit 1
            }
            run_id="$(jq -r '.id' "$RUNNER_TEMP/run.json")"
            run_sha="$(jq -r '.head_sha' "$RUNNER_TEMP/run.json")"
          else
            gh api "repos/$GH_REPO/actions/workflows/desktop-packaging.yml/runs?event=workflow_dispatch&status=success&per_page=100" > "$RUNNER_TEMP/runs.json"
            run_id="$(jq -r '.workflow_runs[0].id // empty' "$RUNNER_TEMP/runs.json")"
            run_sha="$(jq -r '.workflow_runs[0].head_sha // empty' "$RUNNER_TEMP/runs.json")"
          fi
          [[ -n "$run_id" && -n "$run_sha" ]] || { echo "No successful packaging run found." >&2; exit 1; }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "run_sha=$run_sha" >> "$GITHUB_OUTPUT"

      - name: Download packaging artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ steps.resolve.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/installers"
          gh run download "$RUN_ID" --repo "$GH_REPO" --dir "$RUNNER_TEMP/installers"

      - name: Resolve packaged version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_SHA: ${{ steps.resolve.outputs.run_sha }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t manifests < <(find "$RUNNER_TEMP/installers" -name release-version.txt -type f | sort)
          (( ${#manifests[@]} >= 1 && ${#manifests[@]} <= 3 )) || {
            echo "Expected between one and three version manifests." >&2
            exit 1
          }
          version="$(cat "${manifests[0]}")"
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          for manifest in "${manifests[@]}"; do
            [[ "$(cat "$manifest")" == "$version" ]] || {
              echo "Package versions differ." >&2
              exit 1
            }
          done
          if gh release view "$version" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Appending missing installers to existing release $version" >> "$GITHUB_STEP_SUMMARY"
          elif gh api "repos/$GH_REPO/git/ref/tags/$version" >/dev/null 2>&1; then
            echo "Tag $version already exists without a release; refusing to create an ambiguous release." >&2
            exit 1
          fi
          echo "release_tag=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing $version from commit $RUN_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Validate installer files
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/installers"
          mapfile -d '' files < <(find . -type f \( -name '*.exe' -o -name '*.deb' -o -name '*.AppImage' -o -name 'deepLocal-macos.zip' -o -name 'deepLocal-macos.dmg' \) -print0)
          (("${#files[@]}" > 0)) || { echo "No installer files were downloaded." >&2; exit 1; }
          find . -type f | sort
          find . -type f \( -name '*.exe' -o -name '*.deb' -o -name '*.AppImage' \) -exec sha256sum {} +
          for artifact_dir in deeplocal-*; do
            [[ -d "$artifact_dir" ]] || continue
            case "$artifact_dir" in
              deeplocal-Windows-*)
                find "$artifact_dir" -type f -name '*.exe' | grep -q . || { echo "Windows installer is missing." >&2; exit 1; }
                ;;
              deeplocal-Linux-*)
                find "$artifact_dir" -type f -name '*.deb' | grep -q . || { echo "Linux DEB is missing." >&2; exit 1; }
                find "$artifact_dir" -type f -name '*.AppImage' | grep -q . || { echo "Linux AppImage is missing." >&2; exit 1; }
                ;;
              deeplocal-macOS-*)
                find "$artifact_dir" -type f -name 'deepLocal-macos.zip' | grep -q . || { echo "macOS ZIP is missing." >&2; exit 1; }
                find "$artifact_dir" -type f -name 'deepLocal-macos.dmg' | grep -q . || { echo "macOS DMG is missing." >&2; exit 1; }
                ;;
              *)
                echo "Unexpected packaging artifact: $artifact_dir" >&2
                exit 1
                ;;
            esac
          done
          mkdir -p "$RUNNER_TEMP/upload"
          for file in "${files[@]}"; do
            name="$(basename "$file")"
            [[ ! -e "$RUNNER_TEMP/upload/$name" ]] || { echo "Duplicate installer filename: $name" >&2; exit 1; }
            cp "$file" "$RUNNER_TEMP/upload/$name"
          done

      - name: Upload installers to existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=("$RUNNER_TEMP"/upload/*)
          (("${#files[@]}" > 0)) || exit 1
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json assets --jq '.assets[].name' > "$RUNNER_TEMP/existing-assets.txt"
            new_files=()
            for file in "${files[@]}"; do
              name="$(basename "$file")"
              if grep -Fxq "$name" "$RUNNER_TEMP/existing-assets.txt"; then
                echo "Skipping existing installer $name in $RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
                continue
              fi
              new_files+=("$file")
            done
            if (( ${#new_files[@]} > 0 )); then
              gh release upload "$RELEASE_TAG" "${new_files[@]}" --repo "$GH_REPO"
            fi
            echo "Added ${#new_files[@]} installer(s) to $RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
          else
            gh release create "$RELEASE_TAG" "${files[@]}" --repo "$GH_REPO" --target "${{ steps.resolve.outputs.run_sha }}" --title "deepLocal $RELEASE_TAG" --notes "Desktop installers for the selected platforms."
          fi
          gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json url --jq '.url' >> "$GITHUB_STEP_SUMMARY"
